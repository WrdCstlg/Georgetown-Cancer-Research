name: tests

on:
  push:
    branches: [main]
  pull_request:   # any base branch, so stacked PRs are gated too
    types: [opened, reopened, synchronize, edited]   # edited: body fixes re-run the spec-id gate

jobs:
  test:
    name: test (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both versions from AGENTS.md §Environment: 3.8 = documented floor
        # (walrus operator in producers/variant_effect/reclassify.py),
        # 3.14 = the version development actually runs on.
        # Whether the floor claim survives is decision D-003 (PROPOSED) —
        # until the owner decides, CI covers both.
        python-version: ["3.8", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No install step: both suites are standard-library only (AGENTS.md §Environment).
      - name: variant_effect golden fixtures + guardrails
        run: python tests/test_variant_effect.py

      - name: core ingest write path + provenance enforcement
        run: python tests/test_core_ingest.py

      - name: query read API (SPEC-015)
        run: python tests/test_query_read_api.py

      - name: status-ui shim (SPEC-018)
        run: python tests/test_status_ui_shim.py

      - name: core data integrity (SPEC-025)
        run: python tests/test_core_integrity.py

      # SPEC-005 (partial) + SPEC-027. NOTE: CI has NO AlphaMissense score cache —
      # the data is CC BY-NC-SA 4.0 and is deliberately not committed (decision
      # D-006; docs/alphamissense-data.md). So the four score-dependent tests SKIP
      # here and the suite reports "INCOMPLETE COVERAGE", loudly, rather than
      # pretending to pass. What CI DOES gate: both published am_class vocabularies
      # normalizing identically, the VariantInput contract staying unchanged,
      # identifier refusals, and cutoff transcription.
      # Whether CI should fetch the data is a D2/D3 question and is NOT decided here;
      # if it is ever answered yes, add the fetch step and set
      # ALPHAMISSENSE_CACHE_REQUIRED=1 to turn a skip back into a failure.
      - name: alphamissense provider + identifier seam (SPEC-005 partial, SPEC-027)
        run: python tests/test_alphamissense_provider.py

      # SPEC-005 part 2 of 4. Same story as AlphaMissense: CI has no EVE cache
      # (licence provenance is OPEN under D3, so nothing is committed), so the
      # data-dependent tests SKIP and the suite reports INCOMPLETE rather than
      # pretending to pass. CI still gates EVE vocabulary normalization, the
      # additive identifier-seam extension, refusals, config transcription and
      # fixture discriminating power.
      - name: eve provider + seam extension (SPEC-005 partial, SPEC-027)
        run: python tests/test_eve_provider.py

      # The consensus payoff measurement. Needs BOTH caches, so in CI it skips
      # and says so; run locally after populating both fetchers to see the VUS
      # movement and the disagreement table (docs/probes/consensus-two-providers.md).
      - name: consensus with two providers (SPEC-005)
        run: python tests/test_consensus_two_providers.py

  # SPEC-017: the STATUS artifacts must match a fresh regeneration — generated
  # docs cannot drift from repo state. Deterministic by contract (no timestamps,
  # no absolute paths, no commit hashes in the output).
  status-drift:
    name: status-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Regenerate STATUS artifacts and fail on any diff
        run: |
          python tools/status/generate_status.py
          if ! git diff --exit-code -- docs/status.json docs/STATUS.md; then
            echo "::error::docs/status.json or docs/STATUS.md is stale: run the generator and commit the result (python tools/status/generate_status.py)."
            exit 1
          fi
          echo "STATUS artifacts are in sync with repo state."

  # I6 made mechanical: every PR body must reference a spec item (SPEC-NNN).
  # Same workflow file as the tests on purpose — one CI surface, one place to
  # look; the job-level `if` keeps it off push events.
  spec-id:
    name: spec-id
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require a SPEC id in the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s' "$PR_BODY" | grep -qE 'SPEC-[0-9]+'; then
            echo "::error::Control I6: this PR body contains no SPEC-NNN reference."
            echo "Add the spec item this change satisfies, e.g. 'Spec item: SPEC-001'."
            echo "The registry is SPEC.md at the repo root; new work adds its spec item to SPEC.md BEFORE code (AGENTS.md §4/§5)."
            exit 1
          fi
          echo "SPEC id found in PR body. (Existence of the ID in SPEC.md is not yet validated — follow-up.)"
